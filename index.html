<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MdView — Markdown 转 PDF</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%232563eb'/%3E%3Ctext x='12' y='16' font-size='11' fill='white' text-anchor='middle' font-family='monospace' font-weight='bold'%3EM%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github.min.css">
<style>
  :root {
    --bg: #f7f8fa;
    --panel: #ffffff;
    --border: #e2e5ea;
    --text: #1f2329;
    --muted: #6b7280;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text); display: flex; flex-direction: column;
  }
  /* ===== 顶栏 ===== */
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .logo { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 16px; }
  .logo-mark { width: 26px; height: 26px; border-radius: 6px; background: var(--accent); color: #fff;
    display: flex; align-items: center; justify-content: center; font-size: 13px; font-family: monospace; }
  .file-label { color: var(--muted); font-size: 13px; flex: 1; min-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .btn {
    border: 1px solid var(--border); background: var(--panel); color: var(--text);
    padding: 7px 14px; border-radius: 7px; font-size: 14px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px; transition: all .15s;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent-hover); color: #fff; }
  input[type=file] { display: none; }
  /* ===== 最近文档下拉 ===== */
  .recent-wrap { position: relative; }
  .dropdown {
    position: absolute; top: 44px; left: 0; width: 320px; max-width: 85vw;
    background: #fff; border: 1px solid var(--border); border-radius: 10px;
    box-shadow: 0 10px 30px rgba(0,0,0,.12); z-index: 100; overflow: hidden;
    display: none;
  }
  .dropdown.open { display: block; }
  .dd-header { padding: 10px 14px; font-size: 12px; color: var(--muted);
    background: #f7f8fa; border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center; }
  .dd-clear { color: var(--accent); cursor: pointer; font-size: 12px; background: none; border: none; }
  .dd-list { max-height: 320px; overflow-y: auto; }
  .dd-item { padding: 10px 14px; display: flex; align-items: center; gap: 10px; cursor: pointer; }
  .dd-item:hover { background: #f5f8ff; }
  .dd-icon { width: 30px; height: 30px; background: #eff6ff; border-radius: 6px;
    display: flex; align-items: center; justify-content: center; font-size: 10px;
    color: var(--accent); flex-shrink: 0; font-family: monospace; }
  .dd-meta { flex: 1; min-width: 0; }
  .dd-name { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dd-sub { font-size: 11px; color: #9ca3af; margin-top: 2px; }
  .dd-x { color: #c0c4cc; padding: 4px 6px; font-size: 14px; }
  .dd-x:hover { color: #ef4444; }
  .dd-empty { padding: 24px; text-align: center; color: #9ca3af; font-size: 13px; }
  /* ===== 主区 ===== */
  main { flex: 1; display: flex; overflow: hidden; }
  .pane { display: flex; flex-direction: column; overflow: hidden; }
  #editor-pane { width: 50%; border-right: 1px solid var(--border); }
  #preview-pane { flex: 1; }
  .pane-title { padding: 8px 16px; font-size: 12px; color: var(--muted); background: var(--panel);
    border-bottom: 1px solid var(--border); letter-spacing: .5px; }
  textarea {
    flex: 1; border: none; outline: none; resize: none; padding: 16px;
    font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 14px; line-height: 1.7;
    background: var(--panel); color: var(--text);
  }
  #preview {
    flex: 1; overflow-y: auto; padding: 32px 48px; background: var(--panel);
    line-height: 1.75; font-size: 15.5px;
  }
  /* Markdown 排版 */
  #preview h1, #preview h2, #preview h3 { line-height: 1.3; margin: 1.2em 0 .6em; }
  #preview h1 { font-size: 1.8em; border-bottom: 2px solid var(--border); padding-bottom: .3em; }
  #preview h2 { font-size: 1.45em; border-bottom: 1px solid var(--border); padding-bottom: .25em; }
  #preview h3 { font-size: 1.2em; }
  #preview p { margin: .6em 0; }
  #preview ul, #preview ol { padding-left: 1.6em; margin: .6em 0; }
  #preview blockquote { border-left: 4px solid var(--border); padding: 4px 16px; color: var(--muted); margin: .8em 0; }
  #preview code { background: #f1f3f5; padding: 2px 6px; border-radius: 4px; font-family: Menlo, Consolas, monospace; font-size: .9em; }
  #preview pre { background: #f6f8fa; padding: 14px 16px; border-radius: 8px; overflow-x: auto; margin: .8em 0; }
  #preview pre code { background: none; padding: 0; }
  #preview table { border-collapse: collapse; margin: .8em 0; width: 100%; }
  #preview th, #preview td { border: 1px solid var(--border); padding: 7px 12px; }
  #preview th { background: #f6f8fa; }
  #preview img { max-width: 100%; }
  #preview hr { border: none; border-top: 1px solid var(--border); margin: 1.2em 0; }
  .empty-hint { color: var(--muted); text-align: center; margin-top: 20vh; font-size: 14px; }
  /* 代码视图模式 */
  body.code-mode #editor-pane { display: none !important; }
  body.code-mode #preview-pane { display: flex !important; width: 100% !important; }
  body.code-mode #preview { padding: 24px 32px; }
  #preview code.hljs { background: #f6f8fa; padding: 16px; border-radius: 8px; font-size: 13.5px; line-height: 1.6; }
  .code-badge { display: inline-block; background: #eff6ff; color: var(--accent); font-size: 11px; padding: 2px 8px; border-radius: 4px; margin-bottom: 12px; font-family: monospace; }
  /* 移动端 */
  .tabbar { display: none; }
  @media (max-width: 768px) {
    main { flex-direction: column; }
    .tabbar { display: flex; background: var(--panel); border-bottom: 1px solid var(--border); }
    .tabbar button { flex: 1; padding: 10px; border: none; background: none; font-size: 14px;
      color: var(--muted); border-bottom: 2px solid transparent; cursor: pointer; }
    .tabbar button.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
    #editor-pane { width: 100%; border-right: none; display: none; height: 100%; }
    #preview-pane { display: none; }
    main.mobile-edit #editor-pane { display: flex; }
    main.mobile-preview #preview-pane { display: flex; }
    #preview { padding: 20px; }
    textarea { font-size: 16px; }
  }
  /* ===== 打印 ===== */
  @media print {
    header, .tabbar, .pane-title, textarea { display: none !important; }
    body, main { display: block; height: auto; overflow: visible; }
    #editor-pane { display: none !important; }
    #preview-pane { display: block !important; }
    #preview { padding: 0; overflow: visible; font-size: 12pt; }
    @page { margin: 2cm; }
  }
</style>
</head>
<body>
<header>
  <div class="logo"><div class="logo-mark">M</div>MdView</div>
  <span class="file-label" id="file-label">未选择文件</span>
  <div class="recent-wrap">
    <button class="btn" id="recent-btn">最近文档 ▾</button>
    <div class="dropdown" id="recent-dropdown">
      <div class="dd-header"><span>最近打开（最多 10 个）</span><button class="dd-clear" id="dd-clear">清除</button></div>
      <div class="dd-list" id="dd-list"></div>
    </div>
  </div>
  <label class="btn" for="file-input">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
    打开文件
  </label>
  <input type="file" id="file-input" accept=".md,.markdown,.m,.c,.h,.cpp,.hpp,.cc,.py,.java,.js,.ts,.json,.xml,.html,.css,.sql,.sh,.txt,.log,.ini,.cfg,.conf,.yaml,.yml,.csv,.vsdx,.pdf,.png,.jpg,.jpeg,.bmp,.gif">
  <button class="btn" id="clear-btn">清空</button>
  <div class="recent-wrap">
    <button class="btn btn-primary" id="export-btn">导出文件 ▾</button>
    <div class="dropdown" id="export-dropdown" style="right:0;left:auto;">
      <div class="dd-list" id="export-list">
        <div class="dd-item" data-type="pdf"><div class="dd-icon">PDF</div><div class="dd-meta"><div class="dd-name">导出为 PDF</div><div class="dd-sub">系统打印对话框，可另存为</div></div></div>
        <div class="dd-item" data-type="html"><div class="dd-icon">HTML</div><div class="dd-meta"><div class="dd-name">导出为 HTML</div><div class="dd-sub">单文件，离线可打开</div></div></div>
        <div class="dd-item" data-type="md"><div class="dd-icon">MD</div><div class="dd-meta"><div class="dd-name">下载 Markdown</div><div class="dd-sub">原始 .md 源码</div></div></div>
      </div>
    </div>
  </div>
</header>
<main id="main" class="mobile-preview">
  <div class="tabbar">
    <button id="tab-edit">编辑</button>
    <button id="tab-view" class="active">预览</button>
  </div>
  <div class="pane" id="editor-pane">
    <div class="pane-title">Markdown 源码</div>
    <textarea id="editor" placeholder="在此粘贴 Markdown 文本，或点击左上角「打开 .md」选择文件…"></textarea>
  </div>
  <div class="pane" id="preview-pane">
    <div class="pane-title">预览</div>
    <div id="preview"><p class="empty-hint">在左侧编辑或打开 .md 文件后，这里将实时渲染（支持 LaTeX 数学公式）</p></div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/highlight.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.0.4/dist/tesseract.min.js"></script>
<script>
const editor = document.getElementById('editor');
const preview = document.getElementById('preview');
const fileLabel = document.getElementById('file-label');

// 文件类型映射
const CODE_LANG_MAP = {
  'm': 'matlab', 'c': 'c', 'h': 'c', 'cpp': 'cpp', 'hpp': 'cpp', 'cc': 'cpp',
  'py': 'python', 'java': 'java', 'js': 'javascript', 'mjs': 'javascript',
  'cjs': 'javascript', 'ts': 'typescript', 'json': 'json', 'xml': 'xml',
  'html': 'xml', 'css': 'css', 'sql': 'sql', 'sh': 'bash', 'bash': 'bash',
  'txt': 'plaintext', 'log': 'plaintext', 'csv': 'plaintext',
  'ini': 'ini', 'cfg': 'ini', 'conf': 'ini', 'yaml': 'yaml', 'yml': 'yaml'
};
const MD_EXT = ['md', 'markdown'];
let currentMode = 'markdown'; // markdown | code
let currentLang = '';

function getExt(name) {
  const parts = name.toLowerCase().split('.');
  return parts.length > 1 ? parts.pop() : '';
}

function render() {
  const text = editor.value;
  if (currentMode === 'code') {
    renderCode(text);
    return;
  }
  if (!text.trim()) {
    preview.innerHTML = '<p class="empty-hint">在左侧编辑或打开文件后，这里将实时渲染（支持 Markdown + LaTeX 公式）</p>';
    return;
  }
  preview.innerHTML = marked.parse(text);
  renderMathInElement(preview, {
    delimiters: [
      {left: '$$', right: '$$', display: true},
      {left: '$', right: '$', display: false}
    ],
    throwOnError: false
  });
}

function renderCode(text) {
  const lang = currentLang || 'plaintext';
  const badge = `<span class="code-badge">${lang.toUpperCase()}</span>`;
  let highlighted;
  try {
    if (lang === 'plaintext') {
      highlighted = escapeHtml(text);
    } else {
      highlighted = hljs.highlight(text, {language: lang}).value;
    }
  } catch {
    highlighted = escapeHtml(text);
  }
  preview.innerHTML = badge + '<pre><code class="hljs">' + highlighted + '</code></pre>';
}

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function setMode(mode, lang) {
  currentMode = mode;
  currentLang = lang || '';
  document.body.classList.toggle('code-mode', mode === 'code');
  document.querySelector('.pane-title').textContent = mode === 'code' ? '代码预览（只读）' : 'Markdown 源码';
}

editor.addEventListener('input', render);

// ===== 最近文档（localStorage，最多 10 个）=====
const RECENT_KEY = 'mdview_recent';
const MAX_RECENT = 10;
const recentBtn = document.getElementById('recent-btn');
const dropdown = document.getElementById('recent-dropdown');
const ddList = document.getElementById('dd-list');

function loadRecent() {
  try { return JSON.parse(localStorage.getItem(RECENT_KEY) || '[]'); }
  catch { return []; }
}
function saveRecent(list) {
  localStorage.setItem(RECENT_KEY, JSON.stringify(list.slice(0, MAX_RECENT)));
}
function addRecent(name, content) {
  let list = loadRecent().filter(it => it.name !== name);
  list.unshift({ name, content, time: Date.now() });
  saveRecent(list);
}
function fmtTime(ts) {
  const diff = Date.now() - ts;
  if (diff < 60e3) return '现在';
  if (diff < 3600e3) return Math.floor(diff / 60e3) + ' 分钟前';
  if (diff < 86400e3) return Math.floor(diff / 3600e3) + ' 小时前';
  if (diff < 7*86400e3) return Math.floor(diff / 86400e3) + ' 天前';
  return new Date(ts).toLocaleDateString();
}
function fmtSize(n) {
  return n > 1024*1024 ? (n/1024/1024).toFixed(1)+' MB' : Math.max(1, Math.round(n/1024))+' KB';
}
function renderRecent() {
  const list = loadRecent();
  ddList.innerHTML = list.length ? '' : '<div class="dd-empty">暂无最近文档</div>';
  list.forEach((it, idx) => {
    const row = document.createElement('div');
    row.className = 'dd-item';
    row.innerHTML = `<div class="dd-icon">MD</div>
      <div class="dd-meta"><div class="dd-name"></div><div class="dd-sub"></div></div>
      <div class="dd-x" title="移除">×</div>`;
    row.querySelector('.dd-name').textContent = it.name;
    row.querySelector('.dd-sub').textContent = fmtTime(it.time) + ' · ' + fmtSize(new Blob([it.content]).size);
    row.addEventListener('click', () => {
      editor.value = it.content;
      fileLabel.textContent = it.name;
      const ext = getExt(it.name);
      if (MD_EXT.includes(ext)) setMode('markdown');
      else setMode('code', CODE_LANG_MAP[ext] || 'plaintext');
      render();
      dropdown.classList.remove('open');
    });
    row.querySelector('.dd-x').addEventListener('click', (e) => {
      e.stopPropagation();
      saveRecent(loadRecent().filter((_, i) => i !== idx));
      renderRecent();
    });
    ddList.appendChild(row);
  });
}
recentBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  renderRecent();
  dropdown.classList.toggle('open');
});
document.addEventListener('click', (e) => {
  if (!dropdown.contains(e.target)) dropdown.classList.remove('open');
});
document.getElementById('dd-clear').addEventListener('click', () => {
  localStorage.removeItem(RECENT_KEY);
  renderRecent();
});

document.getElementById('file-input').addEventListener('change', async function(e) {
  const file = e.target.files[0];
  if (!file) return;
  fileLabel.textContent = file.name;
  const ext = getExt(file.name);

  // vsdx 文件：用 JSZip 解压提取文本
  if (ext === 'vsdx') {
    try {
      const zip = await JSZip.loadAsync(await file.arrayBuffer());
      let texts = [];
      const pageFiles = Object.keys(zip.files).filter(p =>
        p.startsWith('visio/pages/page') && p.endsWith('.xml'));
      for (const pf of pageFiles.sort()) {
        const xml = await zip.files[pf].async('string');
        const matches = xml.match(/<Text[^>]*>([^<]+)<\/Text>/g) || [];
        matches.forEach(m => {
          const t = m.replace(/<[^>]+>/g, '').trim();
          if (t) texts.push(t);
        });
      }
      const content = '# ' + file.name + '\n\n> Visio 文件文本提取（图形内容不显示）\n\n' +
        texts.map(t => '- ' + t).join('\n');
      editor.value = content;
      setMode('markdown');
      render();
      addRecent(file.name, content);
    } catch (err) {
      alert('无法解析 Visio 文件：' + err.message);
    }
    e.target.value = '';
    return;
  }

  // PDF 文件：提取文字
  if (ext === 'pdf') {
    try {
      const content = await extractPDF(file);
      editor.value = content;
      setMode('markdown');
      render();
      addRecent(file.name.replace('.pdf', '.md'), content);
    } catch (err) {
      alert('PDF 解析失败：' + err.message);
    }
    e.target.value = '';
    return;
  }

  // 图片文件：OCR
  if (['png', 'jpg', 'jpeg', 'bmp', 'gif'].includes(ext)) {
    try {
      const content = await extractImage(file);
      editor.value = content;
      setMode('markdown');
      render();
      addRecent(file.name.replace(/\.\w+$/, '.md'), content);
    } catch (err) {
      alert('OCR 失败：' + err.message);
    }
    e.target.value = '';
    return;
  }

  const reader = new FileReader();
  reader.onload = ev => {
    editor.value = ev.target.result;
    if (MD_EXT.includes(ext)) {
      setMode('markdown');
    } else {
      setMode('code', CODE_LANG_MAP[ext] || 'plaintext');
    }
    render();
    addRecent(file.name, ev.target.result);
  };
  reader.readAsText(file, 'utf-8');
  e.target.value = '';
});

document.getElementById('clear-btn').addEventListener('click', () => {
  editor.value = ''; fileLabel.textContent = '未选择文件'; setMode('markdown'); render();
});

// ===== 导出文件下拉 =====
const exportBtn = document.getElementById('export-btn');
const exportDropdown = document.getElementById('export-dropdown');
exportBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  if (!editor.value.trim()) { alert('请先打开或粘贴内容'); return; }
  exportDropdown.classList.toggle('open');
});
document.addEventListener('click', (e) => {
  if (!exportDropdown.contains(e.target)) exportDropdown.classList.remove('open');
});

document.querySelectorAll('#export-list .dd-item').forEach(item => {
  item.addEventListener('click', () => {
    const type = item.dataset.type;
    exportDropdown.classList.remove('open');
    if (type === 'pdf') {
      if (window.AndroidBridge) AndroidBridge.print();
      else window.print();
    } else if (type === 'md') {
      const name = (fileLabel.textContent.replace(/\.\w+$/, '') || 'document') + '.md';
      const blob = new Blob([editor.value], {type: 'text/markdown;charset=utf-8'});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = name;
      a.click();
      URL.revokeObjectURL(a.href);
    } else if (type === 'html') {
      let katexCSS = '';
      fetch('https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css').then(r => r.text()).then(css => {
        katexCSS = css;
        const title = fileLabel.textContent.replace(/\.\w+$/, '') || 'document';
        const body = preview.innerHTML;
        const html = '<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>' + title + '</title><style>body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;max-width:800px;margin:40px auto;padding:0 20px;line-height:1.75;color:#1f2329}h1,h2,h3{line-height:1.3}h1{font-size:1.8em;border-bottom:2px solid #e2e5ea;padding-bottom:.3em}h2{font-size:1.45em;border-bottom:1px solid #e2e5ea;padding-bottom:.25em}h3{font-size:1.2em}code{background:#f1f3f5;padding:2px 6px;border-radius:4px;font-family:Menlo,Consolas,monospace;font-size:.9em}pre{background:#f6f8fa;padding:14px 16px;border-radius:8px;overflow-x:auto}pre code{background:none;padding:0}table{border-collapse:collapse;width:100%}th,td{border:1px solid #e2e5ea;padding:7px 12px}th{background:#f6f8fa}img{max-width:100%}blockquote{border-left:4px solid #e2e5ea;padding:4px 16px;color:#6b7280}' + katexCSS + '</style></head><body>' + body + '</body></html>';
        const blob = new Blob([html], {type: 'text/html;charset=utf-8'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = title + '.html';
        a.click();
        URL.revokeObjectURL(a.href);
      });
    }
  });
});

// ===== PDF.js 配置 =====
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';

function showLoading(msg) {
  preview.innerHTML = '<p class="empty-hint" style="margin-top:30vh">' + msg + '</p>';
}

async function extractPDF(file) {
  showLoading('正在解析 PDF，提取文字…');
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({data: buf}).promise;
  let out = '# ' + file.name + '\n\n';
  for (let i = 1; i <= pdf.numPages; i++) {
    const page = await pdf.getPage(i);
    const tc = await page.getTextContent();
    // 按 y 坐标分行
    const lines = {};
    let maxSize = 0;
    tc.items.forEach(it => {
      const y = Math.round(it.transform[5]);
      const size = it.height || 12;
      if (size > maxSize) maxSize = size;
      if (!lines[y]) lines[y] = [];
      lines[y].push({x: it.transform[4], text: it.str, size});
    });
    const ys = Object.keys(lines).sort((a, b) => b - a);
    ys.forEach(y => {
      const items = lines[y].sort((a, b) => a.x - b.x);
      const lineText = items.map(it => it.text).join('').trim();
      if (!lineText) return;
      const avgSize = items.reduce((s, it) => s + it.size, 0) / items.length;
      if (avgSize > maxSize * 0.9 && lineText.length < 80) {
        out += '## ' + lineText + '\n\n';
      } else {
        out += lineText + '\n\n';
      }
    });
    if (i < pdf.numPages) out += '\n---\n\n';
  }
  return out;
}

async function extractImage(file) {
  showLoading('正在 OCR 识别图片文字（首次需加载语言包，约 5MB）…');
  const worker = await Tesseract.createWorker(['chi_sim', 'eng'], 1, {
    logger: m => {
      if (m.status === 'recognizing text') {
        showLoading('OCR 识别中…' + Math.round(m.progress * 100) + '%');
      }
    }
  });
  const {data} = await worker.recognize(file);
  await worker.terminate();
  return '# ' + file.name + '\n\n' + (data.text || '').trim();
}
